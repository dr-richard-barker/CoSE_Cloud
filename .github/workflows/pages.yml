# Publishes only the public front door (index.html redirect + Hub/) to GitHub Pages.
# The platform code (apps/, services/, packages/, db/, deploy/) runs at CoSE HQ and is never served from Pages.
# Needs Settings -> Pages -> Source = "GitHub Actions"; until then Pages keeps building the branch root.
name: Deploy Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths: [index.html, .nojekyll, Hub/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the public site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R Hub _site/Hub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
