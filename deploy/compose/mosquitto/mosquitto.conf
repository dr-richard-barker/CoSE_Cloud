# CoSE Cloud broker: CoSE-Care-Agent's deployment settings (handoff/broker/mosquitto.conf) with CoSE Cloud's
# access rules. TLS only, a client certificate required, the certificate's CN is the username.
per_listener_settings false
allow_anonymous false
# a restarted broker forgets queued messages: commands are never delivered late (M3); telemetry the ingest
# service missed while the broker was down is lost, and `seq` gaps show it
persistence false

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
acl_file /mosquitto/config/acl
# AWS IoT Core's 128 KiB payload limit plus 1 KiB for the packet header: nothing works here that would not there
max_packet_size 132096

log_dest stdout
log_type error
log_type warning
log_type notice
